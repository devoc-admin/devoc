name: "Deploy"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    name: "Deploy web to Vercel"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fetch shared Vercel credentials from Doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          inject-env-vars: true
      - name: Fetch web Vercel project id from Doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_WEB_PRD }}
          inject-env-vars: true
      - uses: ./.github/actions/setup
      - name: Install Vercel CLI
        run: bun add -g vercel@59.16.0
      - name: Pull Vercel project config & env
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN
      # DATABASE_URL comes from the Doppler secrets-fetch step above
      # (inject-env-vars). db:deploy no longer wraps itself in `doppler run`.
      - name: Apply prod migrations
        working-directory: apps/admin
        run: bun run db:deploy
      - name: Deploy prebuilt
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
