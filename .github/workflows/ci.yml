name: "Github Actions"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  typecheck:
    name: "Check types on changed files"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun x turbo typecheck --affected

  boundaries:
    name: "Check workspace boundaries"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun x turbo boundaries

  lint-and-format:
    name: "Lint and format check (biome ci)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun x turbo ci --affected

  build:
    name: "Build apps and packages"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build
        # saveurs-aude needs its own database, so it builds in its own job.
        run: bun x turbo build --affected --filter=!saveurs-aude
        env:
          # @dev-oc/auth checks DATABASE_URL when the auth route is loaded,
          # which `next build` does while collecting page data.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  build-saveurs-aude:
    name: "Build saveurs-aude"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Payload queries the database while prerendering pages. A throwaway
    # Postgres with migrations applied is enough: the build needs the schema,
    # not real content, so no production secrets are involved.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: password
          POSTGRES_DB: saveurs_aude
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data:rw
    env:
      DATABASE_URL: postgresql://payload:password@localhost:5432/saveurs_aude
      PAYLOAD_SECRET: ci-dummy-secret-not-used-at-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Apply migrations
        run: bun x turbo db:deploy --affected --filter=saveurs-aude
      - name: Build
        run: bun x turbo build --affected --filter=saveurs-aude
