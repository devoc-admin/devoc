name: "Github Actions"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  typecheck:
    name: "Check types on changed files"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          inject-env-vars: true
      - uses: ./.github/actions/setup
      - run: bun x turbo typecheck --affected

  boundaries:
    name: "Check workspace boundaries"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun x turbo boundaries

  lint-and-format:
    name: "Lint and format check (biome ci)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          inject-env-vars: true
      - uses: ./.github/actions/setup
      - run: bun x turbo ci --affected

  build:
    name: "Build apps and packages"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch shared CI secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_SHARED }}
          inject-env-vars: true
      - uses: ./.github/actions/setup
      - name: Build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SHARED }}
        run: bun x turbo build --affected
