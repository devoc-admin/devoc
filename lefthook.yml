pre-commit:
  parallel: true
  jobs:
    - name: Lint changed files
      run: bun x ultracite fix {staged_files}
      glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
      stage_fixed: true
    - name: Check types on changed files
      run: bun x turbo typecheck --affected
    - name: Check workspace boundaries
      run: bun x turbo boundaries
pre-push:
  jobs:
    - name: "Check bun lockfile is in sync"
      run: bun install --frozen-lockfile
commit-msg:
  jobs:
    - name: commitlint
      run: bun x commitlint --edit {1}
